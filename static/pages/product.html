<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta property="og:title" content="Krabz - Pet Supplies">
        <meta name="description" content="Krabz is your go to for all you hermit crab pet supply needs! Check out our range of stock and advice to keep your hermies healthy and happy!">
        <meta property="og:image" content="../assets/branding/favicon.png">

        <link rel="icon" type="image/png" href="../assets/branding/favicon.png">
        <link rel="stylesheet" href="../stylesheets/global-styles.css">
        <link rel="stylesheet" href="../stylesheets/typography.css">
        <link rel="stylesheet" href="../stylesheets/nav.css">
        <link rel="stylesheet" href="../stylesheets/shop.css">

        <title>Krabz - Shop</title>

    </head>
    <body>
        <header>
            <img src="../assets/branding/header-logo.webp" alt="Logo" class="header-logo" oncontextmenu="return false">
            <!-- Shopping cart inspired by freecodecamp -->
            <a href="cart.html" id="cart-btn" aria-label="Shopping cart">
                <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="feather feather-shopping-cart"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
                >
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.1 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span id="item-count">0</span>
            </a>

            <!-- Hamburger menu, inspired by a youtube video -->
            <button class="nav-toggle" aria-label="toggle navigation">
                <span class="hamburger"></span>
            </button>
            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="../../index.html">Home</a></li>
                    <li><a href="care-guide.html">Care Guide</a></li>
                    <li><a href="housing.html">Housing</a></li>
                    <li><a href="feeding.html">Feeding</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section>
                <nav class="breadcrumbs" aria-label="Breadcrumb">
                    <ul>
                        <li><a href="../../index.html">Home</a></li>
                        <li><a href="shop.html">Shop</a></li>
                        <li aria-current="page" id="breadcrumb"></li>
                    </ul>
                </nav>
                <div class="info-container">
                    <div class="product-info">
                        <h1 id="product-title">Loading Product...</h1>
                        <div class="product-img-container">
                            <img id="product-img" src="" alt="">
                        </div>
                        <h2 id="product-price"></h2>
                        <button id="add-to-cart-btn" class="btn">Add to cart</button>
                    </div>
                    <div class="product-data">
                        <article class="desc">
                            <h3>Description</h3>
                            <p id="product-desc"></p>
                        </article>
                        <article>
                            <h3>Reviews</h3>
                            <div id="reviews-container">No reviews yet.</div>
                        </article>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <div class="social-list" >
                <a class="social-btn" id="youtube-btn" href="#"><img src="../assets/branding/socials-01.webp" alt="social icon" class="social-icon"></a>
                <a class="social-btn" id="twitter-btn" href="#"><img src="../assets/branding/socials-02.webp" alt="social icon" class="social-icon"></a>
                <a class="social-btn" id="facebook-btn" href="#"><img src="../assets/branding/socials-03.webp" alt="social icon" class="social-icon"></a>
                <a class="social-btn" id="instagram" href="#"><img src="../assets/branding/socials-04.webp" alt="social icon" class="social-icon"></a>
            </div>
            <small>*Please Note, this is a folio piece, not a real shopping site or company! &copy; All rights reserved! </small>
        </footer>

        <script src="../scripts/nav.js"></script>
        <script src="../scripts/product-loader.js"></script>
    </body>
</html>
